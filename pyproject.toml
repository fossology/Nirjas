[project]
name = "Nirjas"
version = "1.0.1"
description = "A Python library to extract comments and source code out of your file(s)"
authors = [
    {name = "Ayush Bhardwaj", email = "classicayush@gmail.com"},
    {name = "Kaushlendra Pratap", email = "kaushlendrapratap.9837@gmail.com"},
]
license = {text = "LGPL-2.1-or-later"}
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "Nirjas",
    "Code Comment",
    "Comment Extractor",
    "Code Comment Extractor",
    "Source Code Extractor",
    "Source Extractor",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Topic :: Utilities",
    "Topic :: Software Development",
    "Topic :: Text Processing",
]
dependencies = [
    "tree-sitter-language-pack>=1.8.1,<2.0.0",
    # tree-sitter 0.26 broke ABI with the language-pack's bundled parsers
    # (segfaults on node access); cap until the pack ships 0.26 parsers.
    "tree-sitter>=0.23,<0.26",
]

[project.urls]
homepage = "https://github.com/fossology/nirjas"
repository = "https://github.com/fossology/nirjas"

[project.scripts]
nirjas = "nirjas.main:run_and_print"

[project.optional-dependencies]
dev = [
    "pyright>=1.1.409,<2.0.0",
    "pytest>=8.4.2,<9.0.0",
    "ruff>=0.15.15,<1.0.0",
]
gate = [
    "model2vec[inference]>=0.8.2",
    "huggingface-hub>=0.20",
    # Pin the SAME sklearn minor used to train/pickle the skops head. nirjas
    # supports Python 3.10, whose newest sklearn is 1.7.x (>=1.8 needs 3.11+),
    # so the gate is trained + served on 1.7.x. A mismatched minor raises
    # InconsistentVersionWarning and risks invalid results when unpickling.
    "scikit-learn>=1.7,<1.8",
]

[tool.poetry.group.train]
optional = true

[tool.poetry.group.train.dependencies]
model2vec = {version = ">=0.8.2", extras = ["train"]}
datasets = ">=4.5.0"
# Serialize the skops head under the same sklearn minor the gate extra serves
# (1.7.x — the newest that supports nirjas's Python 3.10 floor). Training under
# a newer minor produces a pickle that 3.10 consumers cannot load cleanly.
scikit-learn = ">=1.7,<1.8"
huggingface-hub = ">=0.20"

[build-system]
requires = ["poetry-core>=2.4.1,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
include = [
    { path = "language-pack.toml", format = ["sdist", "wheel"] },
    { path = "scripts/download_parsers.py", format = ["sdist", "wheel"] },
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py310"
# Fixtures and vendored corpus files are test *data*: deliberately odd, and in
# other languages. Linting them is meaningless.
exclude = [
    "tests/data",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
include = ["nirjas", "scripts", "tests"]
# `helpers` is imported as a top-level package because pytest puts `tests/` on
# sys.path (there is no tests/__init__.py).
extraPaths = ["tests"]
exclude = [
    "tests/data",
    "build",
    "dist",
    "Nirjas.egg-info",
    # Dev/CI-only training script: needs the heavy `train` extra (torch) that
    # the lint job does not install. Covered by ruff + its unit tests instead.
    "scripts/train_and_release.py",
    ".venv", "**/node_modules", "**/__pycache__", "**/.*",
]
typeCheckingMode = "standard"
