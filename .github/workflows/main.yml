name: Quality Checks
on: [push, pull_request]

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install quality tooling
        run: |
          python -m pip install --upgrade pip
          # Include the torch-free `gate` extra so pyright can resolve the
          # shipped nirjas/gate inference deps (model2vec[inference],
          # huggingface_hub). The dev-only training script needs the heavy
          # `train` stack and is excluded from pyright instead.
          python -m pip install .[dev,gate]

      - name: Run ruff
        run: ruff check .

      - name: Run pyright
        run: pyright
