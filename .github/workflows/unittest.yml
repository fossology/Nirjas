name: Unit Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    name: Unit Tests on Python ${{ matrix.python-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Cache Tree-Sitter parser bundles
        uses: actions/cache@v5
        with:
          path: ~/.cache/tree-sitter-language-pack
          key: >-
            ${{ runner.os }}-ts-pack-${{ matrix.python-version }}-
            ${{ hashFiles('language-pack.toml', 'pyproject.toml') }}

      - name: Install Nirjas and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Download Tree-Sitter parsers
        run: python scripts/download_parsers.py

      - name: Run tests
        run: pytest
